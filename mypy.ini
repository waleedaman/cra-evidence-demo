# `make lint` runs mypy --strict on pipeline/. spdx-tools 0.8.5 ships no type
# information (no py.typed), nor does ply 3.11; their modules are treated as Any.
[mypy]

[mypy-spdx_tools.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-ply.*]
ignore_missing_imports = True
follow_imports = skip
