# SPDX-License-Identifier: Apache-2.0
#
# West manifest for the CRA evidence demo (this repo is the manifest repository).
# Zephyr is pinned by commit (= tag v4.4.2). Modules are imported from Zephyr's own
# west.yml at that commit, so each one is pinned by the SHA Zephyr declares there.
# Only the modules named in name-allowlist are fetched; everything else in
# Zephyr's manifest is ignored. That keeps `make fetch` small and keeps unused
# code out of the workspace (and therefore out of the SBOM discussion).
#
# Module list rationale (Phase 1, verified by building all three targets):
#   mbedtls       - TLS for MQTT (Mbed TLS 4.1.0)
#   tf-psa-crypto - crypto library that Mbed TLS 4.x is built on (TF-PSA-Crypto 1.1.0)
#   cmsis_6       - Cortex-M core support (RP2350 Arm cores)
#   hal_rpi_pico  - Raspberry Pi RP2350 HAL (Pico 2 / W5500-EVB-Pico2)
# picolibc was dropped: native_sim links the host libc and the board build uses
# the picolibc shipped with the Zephyr SDK, so the module source is never compiled.

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: dccb09599635bdff17633fa7e9dab014b91dce90 # v4.4.2
      import:
        name-allowlist:
          - mbedtls
          - tf-psa-crypto
          - cmsis_6
          - hal_rpi_pico
