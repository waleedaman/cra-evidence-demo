# Release v1.1: changes on top of app/prj.conf (applied with EXTRA_CONF_FILE).
#
# Product change: the sensor node gains IPv6 (dual stack), e.g. for networks that
# no longer hand out IPv4 addresses. Scenario 4 uses this release: IPv6 was
# deliberately disabled in v1.0, and v1.0 decisions that relied on "IPv6 code is not
# compiled" no longer hold.
CONFIG_NET_IPV6=y
