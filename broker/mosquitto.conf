# SPDX-License-Identifier: Apache-2.0
# DEMO broker configuration: TLS only, anonymous clients, no persistence.
# Runs on an internal Docker network without internet access.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
allow_anonymous true
