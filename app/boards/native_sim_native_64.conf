# native_sim: use the host's sockets (Native Simulator Offloaded Sockets, NSOS).
# No TAP interface or extra container privileges needed. Name resolution of the
# broker is offloaded to the host resolver as well.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
