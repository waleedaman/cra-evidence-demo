# Real board: WIZnet W5500 Ethernet (SPI) with Zephyr's native IP stack.
# Static addressing for a direct cable to the presenter laptop:
#   board 192.168.77.2/24  <->  laptop 192.168.77.1 (MQTT broker, port 8883)
# No DHCP and no DNS needed. TLS still verifies the broker name "mosquitto".
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.77.1"
CONFIG_APP_MQTT_BROKER_ADDR="192.168.77.1"
