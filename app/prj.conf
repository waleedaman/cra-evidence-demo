# SPDX-License-Identifier: Apache-2.0
#
# Sensor node: MQTT over TLS 1.2 (ECDHE-ECDSA, AES-128-GCM, P-256).
# Board-specific networking lives in boards/*.conf.
#
# Section "Deliberately disabled" lists features this product does NOT use.
# They are switched off explicitly (not just left at default) so the build
# configuration documents the decision. Phase 8 scenario 3 relies on this:
# a CVE in a disabled feature can be shown to be not applicable.

# --- Kernel / logging ---------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LOG=y
CONFIG_PRINTK=y

# --- Networking -------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NAMESPACE_COMPAT_MODE=n

# --- MQTT over TLS -------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# --- Mbed TLS: only what TLS 1.2 + ECDHE-ECDSA-AES128-GCM-SHA256 needs --------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_ENTROPY_GENERATOR=y

# --- Deliberately disabled ---------------------------------------------------------
# Radio / connectivity this product does not have or use
CONFIG_BT=n
CONFIG_WIFI=n
# TLS protocol variants and features not used
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=n
CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n
CONFIG_MBEDTLS_SSL_ALPN=n
CONFIG_MBEDTLS_SSL_CACHE_C=n
# Certificate handling not used (device only verifies one server chain)
CONFIG_MBEDTLS_PEM_PARSE_C=n
CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_WRITE_C=n
CONFIG_MBEDTLS_X509_CRT_WRITE_C=n
# Key exchanges not used
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=n
# Shells and debug interfaces
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_MBEDTLS_SHELL=n
CONFIG_MBEDTLS_DEBUG=n
